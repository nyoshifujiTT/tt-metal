# CPU-only (device-free) model unit tests.
#
# These jobs run on a CPU runner (cpu_medium) with NO Tenstorrent device
# attached, via the generic fabric-cpu-only-tests-impl.yaml runner (which does
# not pass --device). The tests import ttnn from the build/wheel but never open
# a device, so they must not consume scarce Wormhole/Blackhole runners. Named
# after the fabric_cpu_only_unit_tests.yaml convention (cpu_only + unit) so the
# catalog name matches the test-category (unit); no device/single-card wrapper.
#
# Each entry: name, cmd (literal pytest paths; no device), skus, team, arch,
# owner_id. For max allowed timeout refer to .github/time_budget.yaml
# (models -> unit).

# bge-reranker-v2-m3 shares the bge-m3 model family (same XLM-RoBERTa encoder
# backbone); its device suite is registered alongside bge-m3 in the legacy
# single-card frequent pipeline, and these device-free unit tests run here on a
# CPU runner.
# TODO(migrate): per models/MIGRATING_TO_TIERED_CI.md, models should move to the
# 3-tier CI once bge-m3 migrates off the legacy single-card pipeline; revisit
# this CPU-only registration together with that move.
- name: bge_reranker_v2_m3 cpu-only unit tests
  cmd: |
    pytest models/demos/bge_reranker_v2_m3/tests/test_model_config.py \
           models/demos/bge_reranker_v2_m3/tests/test_generator_vllm.py \
           models/demos/wormhole/bge_m3/tests/unit/test_encode_in_chunks.py \
           models/demos/wormhole/bge_m3/tests/unit/test_embedding_wrapper_init.py \
           models/demos/wormhole/bge_m3/tests/unit/test_xlm_roberta_encoder.py \
           models/demos/wormhole/bge_m3/tests/unit/test_resolve_model_name.py
  skus:
    cpu_medium:
      timeout: 15
  team: models
  arch: blackhole
  # owner_id is the Slack notify target on failure, independent of CODEOWNERS.
  # models/demos/bge_reranker_v2_m3 has no dedicated CODEOWNERS entry, so it falls
  # back to the models/demos catch-all (@uaydonat @yieldthought @cglagovichTT).
  # TODO(owner): assign a real reranker owner -- add a CODEOWNERS line for
  # models/demos/bge_reranker_v2_m3 and update this owner_id to match.
  owner_id: U06UEFWB4P9 # Colman Glagovich (@cglagovichTT, models/demos catch-all)
